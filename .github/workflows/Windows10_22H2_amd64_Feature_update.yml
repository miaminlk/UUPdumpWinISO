name: Windows10_22H2_amd64_Feature_update

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload Actions artifact
        required: false
        default: false
        type: boolean
#on: [push, pull_request]

permissions:
  contents: write

env:
  Build_VERSION: '19045.7291'
  FILE_NAME: Windows10_22H2_amd64_Feature_update

jobs:
  Windows10_22H2_amd64_Feature_update:
    runs-on: windows-latest

    steps:

    # 检出本仓库
    - name: Checkout repository
      uses: actions/checkout@v5

    # 制作ISO
    - name: UUP dump WinISO
      shell: cmd
      run: |
        cd ${{env.FILE_NAME}}
        dir
        uup_download_windows.cmd

    # 查看目录
    - name: dir dir
      shell: cmd
      run: |
        cd ${{env.FILE_NAME}}
        dir

    # 打包
    - name: Package binaries
      run: |
        #ls     #Directory: D:\a\UUPdumpWinISO\UUPdumpWinISO(即仓库目录)
        7z a -v1950M ${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z ./${{env.FILE_NAME}}/*.iso -mx=9

    # 上传镜像
    - name: Upload artifact (optional)
      if: ${{ inputs.upload_artifact }}
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        path: ${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*
        retention-days: 1

    # 发布镜像
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        files: ${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*
        token: ${{ secrets.RELEASE_TOKEN || github.token }}


